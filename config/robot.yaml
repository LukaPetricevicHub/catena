# Single source of truth for robot parameters.
# Simulator, firmware and CAD all read this file. Never hard-code these numbers elsewhere.
# Status: v0 starting values from typical part dimensions. Milestone M5 checks them
# against measured parts and updates this file (record changes in docs/DECISIONS.md).

units: {length: mm, mass: g, angle: deg, time: s}

swarm:
  design_count: 12        # robots in simulation and tests
  first_build_count: 6    # robots in the first hardware build
  min_ring_count: 6       # smallest ring that still cages a 40 mm ball

geometry:
  pitch: 80.0             # centre-to-centre distance of two linked robots
  ring:                   # free-turning top ring ("turret")
    plate_diameter: 78.0
    plate_thickness: 3.0  # upper and lower plate
    groove_height: 5.4    # vertical gap between plates; coupon-tested: 5.3 / 5.4 / 5.6
    hub_diameter: 28.0    # steel ring: two DIN 125 M14 washers (28 x 15 x 2.5)
    acceptance_half_angle: 100.0   # a tongue may enter within +/- this angle of the ring's rear
    max_joint_yaw: 100.0           # chain can bend this far at a hub before plates collide with a tongue
  tongue:
    thickness: 5.0
    width: 22.0
    reach: 66.0           # own centre to tongue tip = pitch - hub_diameter/2
    tip_radius: 11.0
    engagement: 25.0      # length of tongue inside the neighbour's groove when linked
  base:
    envelope_diameter: 72.0   # everything on the base must stay inside this circle while turning
    height: 27.0
    ground_clearance: 3.0
    wheel_diameter: 30.0
    wheel_width: 6.0
    track: 58.0               # wheel centre to wheel centre
  overall_height: 43.0

mass:
  target_total: 95.0      # hard upper bound for the bridge calculation
  ring_assembly: 22.0
  base_assembly: 73.0

coupling:
  tip_magnet: {type: disc, diameter: 6.0, thickness: 3.0, grade: N42}
  hold_force_n: 0.4           # target axial retention at the hub; must stay below traction
  hold_force_range_n: [0.25, 0.55]
  capture_range: 6.0          # distance at which the magnet pulls the tip in
  dock_sense: hall            # analogue hall sensor in the base under the hub
  centering_detent_mnm: 4.0   # weak magnetic detent that points a free tongue along base heading
  joint_play_deg: 0.9         # vertical play per joint from groove clearance, for the bridge

drive:
  motor: N20 plain gearmotor, 6 V class, no shaft encoder
  wheel_tick_sensor: reflective sensor on a 12-stripe pattern printed on the wheel
  max_speed: 100.0            # mm/s at nominal battery voltage
  max_turn_rate: 180.0        # deg/s
  traction_force_n: 0.7       # mu 0.8 x 0.9 N weight; upper bound for pull and push per robot
  wheel_ticks_per_rev: 12     # stripes on the wheel

sensing:
  ir_pairs: 6                 # emitter + phototransistor every 60 deg on the base
  ir_range: 220.0             # usable neighbour ranging distance (centre to centre), assumed
  ir_bearing_sigma_deg: 10.0
  ir_range_sigma_frac: 0.10
  ir_reference_range: 100.0   # calibration: a receiver facing the sender reads 1.0 at this range
  flash_filter_gain: 0.5      # weight of a new flash measurement in a tracked neighbour position
  object_mask_margin: 25.0    # deg beyond a receiver's 90 deg lobe within which a neighbour still spoils it (bearing noise)
  object_min_signal: 2.0      # reflection strength that counts (1.0 = a ball at object_range); robots too far
                              # to be known by their flash still reflect about 0.5 each, and two or three add up
  object_confirm: 3           # reflections in a row before an object counts
  object_range: 110.0         # gap at which a 40 mm white ball is still detected; assumed, measure it
  edge_sensors: 2             # downward, front-left and front-right
  edge_sensor_xy: [30.0, 15.0]  # spot of the left sensor in the base frame; right is mirrored; assumed. No sensor body
                                # fits there: the CAD window is at cad.edge_window_xy (D49, open question in STATUS.md)
  gyro_drift_deg_per_min: 2.0
  ring_angle_sensor: AS5600   # absolute angle of the ring relative to the base
  ring_angle_sigma_deg: 0.1   # assumed

radio:
  transport: ESP-NOW
  rule: accept frames only from senders confirmed by an infrared flash within the last 2 s
  drop_rate: 0.05             # fraction of frames lost, per receiver
  flash_period: 0.1           # s between a robot's FLASH announcements
  flash_jitter: 0.5           # each period varies by up to this fraction, so collisions do not repeat
  flash_collision_window: 0.003  # two FLASH frames closer than this spoil the IR sample
  neighbour_timeout: 2.0      # s; the link layer forgets a sender not seen flashing for this long

core:
  tick_hz: 50                 # behaviour update rate

behaviour:
  wander:
    speed: 60.0               # mm/s
    turn_rate: 40.0           # deg/s, largest random turn rate while cruising
    retarget_period: 1.5      # s between new random turn rates
    edge_memory: 6.0          # s a head with a chain remembers where it met an edge and does not steer back toward it
    edge_clear: 80.0          # deg its new heading keeps from that direction
    backoff_distance: 40.0    # mm reversed after a front edge sensor loses the table
    backoff_speed: 40.0       # mm/s
    spin_rate: 120.0          # deg/s, turning in place
    turn_min: 90.0            # deg turned away from an edge, at least
    turn_max: 180.0           # deg, at most
    avoid_range: 140.0        # mm; a neighbour closer than this ahead makes the robot steer away
    avoid_stop_range: 105.0   # mm; closer than this ahead the robot stops and turns in place
    avoid_half_angle: 70.0    # deg either side of the heading that counts as ahead
    neighbour_memory: 0.5     # s a flash measurement is trusted for steering

  chain:                      # link layer (spec 7.2, 7.3); all values assumed, tuned in simulation
    link_timeout: 0.5         # s without a link frame before a linked neighbour is dropped
    hall_link: 0.5            # hall reading above this: a tongue tip sits on my hub
    hall_lost: 0.02           # hall reading below this: the tip has left
    adopt_delay: 0.3          # s a tip sits on the hub unannounced before the hub robot offers the link
    link_range: 115.0         # mm; a robot measured farther away than this is not the one linked to me
  seek:
    speed: 80.0               # mm/s, a single robot approaching a tail
    turn_gain: 3.0            # 1/s, turn rate per radian of heading error
    memory: 1.0               # s a tracked neighbour position is trusted for seeking
    standoff: 125.0           # mm from the tail where the seeker lines up before docking
    tow_standoff_extra: 60.0  # mm; a head with a chain walks round this much further out, then runs in
    keep_ratio: 0.7           # the current goal counts as this much nearer than it is
    hold_range: 200.0         # mm; a tail asks its chain to stand still for a seeker this close
    traced_speed: 0.3         # share of lead speed left while a lower-ranked head works along my chain
    turn_back: 1              # 1: a head turns back along its chain when a follower sees a higher-ranked chain
  dock:
    window: 35.0              # deg off the middle of the tail's acceptance zone that still starts a dock
    tow_margin: 15.0          # deg the robot behind a docking head must stay clear of its joint limit
    align: 6.0                # deg heading error allowed before driving in
    speed: 30.0               # mm/s
    max_turn_rate: 20.0       # deg/s of correction while driving in
    timeout: 4.0              # s driving in without a LINK_ACK before the attempt has failed
    attempts: 3               # failed attempts before backing off
    backoff_distance: 150.0   # mm
  shape:                      # spec 7.4, 7.5; all values assumed, tuned in simulation
    gain: 12.0                # 1/s; g of the local rule
    max_speed: 20.0           # mm/s of shape correction; faster tears links apart
    min_speed: 6.0            # mm/s; below this a robot stands still instead of turning after noise
    turn_gain: 4.0            # 1/s, the base turning toward its velocity
    offset_gain: 0.02         # lowest weight of one flash bearing in the direction of the robot behind
    close_cone: 30.0          # deg; the head docks onto its tail only if the tail lies where the shape puts it
    offset_samples: 10        # flash bearings of the robot behind needed before its direction is used
    close_range: 130.0        # mm; the head of a closed shape docks onto its own tail from here
    edge_push: 40.0           # mm/s away from a table edge, passed along the chain
    edge_hold: 1.0            # s a robot keeps pushing away after its sensors last saw the edge
    push_decay: 0.8           # share of a neighbour's push that a robot passes on
    twist_max_speed: 60.0     # mm/s, joystick at full deflection
    twist_ramp: 2.0           # s from rest to the commanded speed, while the bases turn into the motion
    twist_catchup: 1.0        # 1/s; a robot behind on the commanded travel adds this share of the distance owed
    twist_max_rate: 20.0      # deg/s, rotate slider at full deflection
  lasso:                      # spec 7.6; values assumed, tuned in simulation
    speed: 30.0               # mm/s of the head while it circles the object
    scan_rate: 40.0           # deg/s; the head sweeps its base across the object, front receiver on it
    scan_half: 60.0           # deg either side of where it first thought the object was
    scan_share: 0.7           # readings at least this share of the strongest locate the peak
    circle_limit: 2.0         # times the expected duration of the circle after which the head stops drawing it
    min_robots: 8             # a shorter chain does not try to close a ring round an object
  sweep:                      # spec 7.7; values assumed, tuned in simulation
    turn: 30.0                # deg the travel turns away from the first edge met, to run along it
    nudge: 10.0               # deg more each time the scoop meets that edge again
    nudge_period: 1.5         # s between two such corrections
    min_slant: 10.0           # deg; an edge met closer to head-on than this gives no side to turn to
  recover:                    # spec 7.8; values assumed, tuned in simulation
    search: 3.0               # s an end that lost its neighbour waits for the other end to show up
    limit: 30.0               # s after which the two ends stop waiting for each other in any case
  follow:
    hall_target: 0.75         # hall reading a follower keeps on the hub ahead (gap about 1.5 mm)
    gain: 120.0               # mm/s per unit of hall error
    turn_gain: 4.0            # 1/s, turns the base under the tongue
    lead_speed: 70.0          # mm/s, a head with robots behind it
    slack_stop: 0.25          # lowest hall reading along the chain at which the head stops
    slack_full: 0.5           # ... and above which it drives at full lead speed

bridge:
  max_unsupported: 2          # robots allowed in the air at once
  first_gap: 80.0             # one pitch
  expected_tip_droop: 5.0     # with two robots unsupported

table:
  size: [1400.0, 900.0]       # a straight chain of twelve is 880 long
  edge_margin: 25.0           # robots turn away at this distance from an edge

test_objects:
  ball: {diameter: 40.0, mass: 2.7}        # table-tennis ball
  block: {size: 20.0, mass: 6.0}           # wooden cube

sim:                          # 2D simulator model, not robot hardware
  physics_hz: 240
  solver_iterations: 20
  contact_friction: 0.3       # plate on plate and base on base
  ring_damping_ratio: 0.5     # bearing friction of a free ring, as a fraction of critical damping
  link_seat_speed: 100.0      # mm/s; fastest a new link pulls a tip into line with the hub
  ball_rolling_decel: 80.0    # mm/s^2; a table-tennis ball rolling on a table top slows by about this
  ball_elasticity: 0.3        # bounce of the ball off a robot base
  block_table_friction: 0.4   # sliding friction of a wooden cube on the table top; assumed
  gravity: 9810.0             # mm/s^2
  start_spacing: 110.0        # mm; random starts keep centres at least this far apart

cad:                          # printed parts (spec 11): typical or datasheet sizes, nothing here is measured (D50)
  print:
    bed: [180.0, 180.0]
    min_wall: 1.2
    max_overhang: 50.0        # deg from the vertical
    max_bridge: 10.0          # mm; longest flat ceiling printed without support
    density: {PETG: 1.27, PLA: 1.24, TPU: 1.21}   # g/cm^3, for the mass estimate
  shell: {wall: 1.6, floor: 2.0, lid: 2.0}
  fit:
    turning: 0.3              # diametral clearance of a journal in its bore
    static: 0.2               # diametral clearance of parts pushed together by hand
    side: 0.1                 # per side, a part dropped into a slot
  nose: {height: 3.0}         # the base is chamfered front and rear from its floor up by this much (sloped nose, spec 3)
  motor:                      # N20 gearmotor, typical sizes
    section: [12.0, 10.0]     # across, tall
    length: 24.0              # gearbox plus can
    terminals: 1.5            # behind the can
    shaft: {diameter: 3.0, flat: 2.5, length: 10.0}
  wheel:
    well_clearance: 1.0       # radial, wheel to chassis
    side_clearance: 0.4       # wheel face to chassis
    tyre_thickness: 1.5       # tyre outside the hub flanges
    groove_depth: 1.2         # V groove that seats a 24 x 3 O-ring or the printed tyre
    groove_floor: 1.2
    stripe_depth: 0.4
    stripe_radii: [7.0, 12.0]
  screw:
    m2: {pilot: 1.7, clear: 2.3, head: 3.8}
    m3: {pilot: 2.5, clear: 3.4, head: 6.0}
  pillar: {x: 31.6, diameter: 4.4}     # lid screw pillars, front and rear on the centre line
  carrier: {thickness: 1.6, post_diameter: 4.0, post_y: 20.0, slot: [5.0, 12.0], slot_x: 14.0}
  ir:
    hole: 3.2                 # 3 mm LED or phototransistor
    height: 25.0              # hole axis above the table
    pair_spacing: 5.2         # the four pairs beside the wheels
    axis_pair_spacing: 10.0   # front and rear pair; a screw pillar stands between the two holes
    wheel_side_shift: 3.9     # those four pairs sit this far off their 60 deg line, away from the wheel
  reflective_sensor: {body: [10.2, 5.8], clearance: 0.2}   # TCRT5000 datasheet
  tick_sensor_x: 11.0
  edge_window_xy: [27.0, 13.5]   # the farthest out a 10.2 x 5.8 mm edge sensor fits inside the wall; the simulator
                                 # still senses at sensing.edge_sensor_xy (D49)
  skid: {width: 4.0, clearance: 0.3, foot: [18.5, 27.5], back: 17.0, tab: [20.0, 23.0]}
  bearing:
    journal_diameter: 10.0
    spigot_diameter: 8.0
    spigot_flat: 3.5          # flat on the spigot, from the axis; keeps the angle magnet from slipping
    flange_diameter: 16.0
    flange_thickness: 1.5
    axial_play: 0.2
    land_diameter: 26.0       # thrust land on the lid that the ring rides on
    angle_magnet: [6.0, 2.5]  # diametric disc for the AS5600
  hub_washer: {bore: 15.0, thickness: 2.5, count: 2}   # DIN 125 M14
  ring:
    core_clearance: 0.2       # diametral, hub core in the washers
    sector_clearance: 0.5     # solid front sector to a neighbour's tongue at the yaw limit
    hub_clearance: 0.5        # solid front sector to the steel hub
    screw_xy: [28.0, 14.0]    # M2 that holds the upper plate on the front sector; mirrored
  tongue: {magnet_wall: 1.6}  # plastic between tip magnet and hub; coupon-tested
  detent: {magnet: [3.0, 2.0], radius: 24.0, gap: 3.0}
  coupon:
    groove_heights: [5.3, 5.4, 5.6]
    magnet_walls: [1.2, 1.6, 2.0]
    shaft_fits: [-0.1, 0.0, 0.1]      # added to shaft diameter and flat
