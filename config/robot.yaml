# Single source of truth for robot parameters.
# Simulator, firmware and CAD all read this file. Never hard-code these numbers elsewhere.
# Status: v0 starting values from typical part dimensions. Milestone M5 checks them
# against measured parts and updates this file (record changes in docs/DECISIONS.md).

units: {length: mm, mass: g, angle: deg, time: s}

swarm:
  design_count: 12        # robots in simulation and tests
  first_build_count: 6    # robots in the first hardware build
  min_ring_count: 6       # smallest ring that still cages a 40 mm ball

geometry:
  pitch: 80.0             # centre-to-centre distance of two linked robots
  ring:                   # free-turning top ring ("turret")
    plate_diameter: 78.0
    plate_thickness: 3.0  # upper and lower plate
    groove_height: 5.4    # vertical gap between plates; coupon-tested: 5.3 / 5.4 / 5.6
    hub_diameter: 28.0    # steel ring: two DIN 125 M14 washers (28 x 15 x 2.5)
    acceptance_half_angle: 100.0   # a tongue may enter within +/- this angle of the ring's rear
    max_joint_yaw: 100.0           # chain can bend this far at a hub before plates collide with a tongue
  tongue:
    thickness: 5.0
    width: 22.0
    reach: 66.0           # own centre to tongue tip = pitch - hub_diameter/2
    tip_radius: 11.0
    engagement: 25.0      # length of tongue inside the neighbour's groove when linked
  base:
    envelope_diameter: 72.0   # everything on the base must stay inside this circle while turning
    height: 27.0
    ground_clearance: 3.0
    wheel_diameter: 30.0
    wheel_width: 6.0
    track: 58.0               # wheel centre to wheel centre
  overall_height: 43.0

mass:
  target_total: 95.0      # hard upper bound for the bridge calculation
  ring_assembly: 22.0
  base_assembly: 73.0

coupling:
  tip_magnet: {type: disc, diameter: 6.0, thickness: 3.0, grade: N42}
  hold_force_n: 0.4           # target axial retention at the hub; must stay below traction
  hold_force_range_n: [0.25, 0.55]
  capture_range: 6.0          # distance at which the magnet pulls the tip in
  dock_sense: hall            # analogue hall sensor in the base under the hub
  centering_detent_mnm: 4.0   # weak magnetic detent that points a free tongue along base heading
  joint_play_deg: 0.9         # vertical play per joint from groove clearance, for the bridge

drive:
  motor: N20 plain gearmotor, 6 V class, no shaft encoder
  wheel_tick_sensor: reflective sensor on a 12-stripe pattern printed on the wheel
  max_speed: 100.0            # mm/s at nominal battery voltage
  max_turn_rate: 180.0        # deg/s
  traction_force_n: 0.7       # mu 0.8 x 0.9 N weight; upper bound for pull and push per robot
  wheel_ticks_per_rev: 12     # stripes on the wheel

sensing:
  ir_pairs: 6                 # emitter + phototransistor every 60 deg on the base
  ir_range: 220.0             # usable neighbour ranging distance (centre to centre), assumed
  ir_bearing_sigma_deg: 10.0
  ir_range_sigma_frac: 0.10
  ir_reference_range: 100.0   # calibration: a receiver facing the sender reads 1.0 at this range
  flash_filter_gain: 0.5      # weight of a new flash measurement in a tracked neighbour position
  object_range: 110.0         # gap at which a 40 mm white ball is still detected; assumed, measure it
  edge_sensors: 2             # downward, front-left and front-right
  edge_sensor_xy: [30.0, 15.0]  # spot of the left sensor in the base frame; right is mirrored; assumed
  gyro_drift_deg_per_min: 2.0
  ring_angle_sensor: AS5600   # absolute angle of the ring relative to the base
  ring_angle_sigma_deg: 0.1   # assumed

radio:
  transport: ESP-NOW
  rule: accept frames only from senders confirmed by an infrared flash within the last 2 s
  drop_rate: 0.05             # fraction of frames lost, per receiver
  flash_period: 0.1           # s between a robot's FLASH announcements
  flash_jitter: 0.5           # each period varies by up to this fraction, so collisions do not repeat
  flash_collision_window: 0.003  # two FLASH frames closer than this spoil the IR sample
  neighbour_timeout: 2.0      # s; the link layer forgets a sender not seen flashing for this long

core:
  tick_hz: 50                 # behaviour update rate

behaviour:
  wander:
    speed: 60.0               # mm/s
    turn_rate: 40.0           # deg/s, largest random turn rate while cruising
    retarget_period: 1.5      # s between new random turn rates
    backoff_distance: 40.0    # mm reversed after a front edge sensor loses the table
    backoff_speed: 40.0       # mm/s
    spin_rate: 120.0          # deg/s, turning in place
    turn_min: 90.0            # deg turned away from an edge, at least
    turn_max: 180.0           # deg, at most
    avoid_range: 140.0        # mm; a neighbour closer than this ahead makes the robot steer away
    avoid_stop_range: 105.0   # mm; closer than this ahead the robot stops and turns in place
    avoid_half_angle: 70.0    # deg either side of the heading that counts as ahead
    neighbour_memory: 0.5     # s a flash measurement is trusted for steering

  chain:                      # link layer (spec 7.2, 7.3); all values assumed, tuned in simulation
    link_timeout: 0.5         # s without a link frame before a linked neighbour is dropped
    hall_link: 0.5            # hall reading above this: a tongue tip sits on my hub
    hall_lost: 0.02           # hall reading below this: the tip has left
    adopt_delay: 0.3          # s a tip sits on the hub unannounced before the hub robot offers the link
    link_range: 115.0         # mm; a robot measured farther away than this is not the one linked to me
  seek:
    speed: 80.0               # mm/s, a single robot approaching a tail
    turn_gain: 3.0            # 1/s, turn rate per radian of heading error
    memory: 1.0               # s a tracked neighbour position is trusted for seeking
    standoff: 125.0           # mm from the tail where the seeker lines up before docking
    keep_ratio: 0.7           # the current goal counts as this much nearer than it is
    hold_range: 200.0         # mm; a tail asks its chain to stand still for a seeker this close
    turn_back: 1              # 1: a head turns back along its chain when a follower sees a higher-ranked chain
  dock:
    window: 35.0              # deg off the middle of the tail's acceptance zone that still starts a dock
    align: 6.0                # deg heading error allowed before driving in
    speed: 30.0               # mm/s
    max_turn_rate: 20.0       # deg/s of correction while driving in
    timeout: 4.0              # s driving in without a LINK_ACK before the attempt has failed
    attempts: 3               # failed attempts before backing off
    backoff_distance: 150.0   # mm
  follow:
    hall_target: 0.75         # hall reading a follower keeps on the hub ahead (gap about 1.5 mm)
    gain: 120.0               # mm/s per unit of hall error
    turn_gain: 4.0            # 1/s, turns the base under the tongue
    lead_speed: 70.0          # mm/s, a head with robots behind it
    slack_stop: 0.25          # lowest hall reading along the chain at which the head stops
    slack_full: 0.5           # ... and above which it drives at full lead speed

bridge:
  max_unsupported: 2          # robots allowed in the air at once
  first_gap: 80.0             # one pitch
  expected_tip_droop: 5.0     # with two robots unsupported

table:
  size: [1400.0, 900.0]       # a straight chain of twelve is 880 long
  edge_margin: 25.0           # robots turn away at this distance from an edge

test_objects:
  ball: {diameter: 40.0, mass: 2.7}        # table-tennis ball
  block: {size: 20.0, mass: 6.0}           # wooden cube

sim:                          # 2D simulator model, not robot hardware
  physics_hz: 240
  solver_iterations: 20
  contact_friction: 0.3       # plate on plate and base on base
  ring_damping_ratio: 0.5     # bearing friction of a free ring, as a fraction of critical damping
  link_seat_speed: 100.0      # mm/s; fastest a new link pulls a tip into line with the hub
  start_spacing: 110.0        # mm; random starts keep centres at least this far apart
