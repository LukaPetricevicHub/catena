name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # PYTHON=python: use the interpreter setup-python installed, not a system python3.x.
      # cadquery pulls in VTK, which needs these two libraries on a bare Linux runner.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxrender1
      - run: make setup PYTHON=python
      - run: make cad
      - run: make test
      - run: make lint
